<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serenity Yachting Club</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Serenity Yachting Club — переходьте на офіційний сайт serenityyachting.club" />
  <link rel="icon" type="image/svg+xml" href="assets/serenity-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--navy:#14202e;--ivory:#f6f1e7;--brass:#b08d57;--brass-2:#c2a878}
    html,body{height:100%}
    body{
      font-family:'Jost',-apple-system,'Segoe UI',sans-serif;
      color:var(--ivory);text-align:center;background:var(--navy);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      overflow:hidden;position:relative;padding:2rem;-webkit-font-smoothing:antialiased;
    }
    .bg{
      position:absolute;inset:0;
      background:url('https://images.unsplash.com/photo-1769610352818-cf8fa29ccf9a?auto=format&fit=crop&w=2000&q=80') center/cover no-repeat;
      transform:scale(1.06);animation:zoom 20s ease-out forwards;
    }
    @keyframes zoom{to{transform:scale(1)}}
    .veil{position:absolute;inset:0;background:linear-gradient(rgba(9,17,27,.70) 0%,rgba(9,17,27,.84) 100%)}
    .box{position:relative;z-index:2;max-width:660px;animation:rise 1s cubic-bezier(.22,.61,.36,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    .mark{width:104px;height:auto;display:block;margin:0 auto 1.5rem;filter:drop-shadow(0 10px 28px rgba(0,0,0,.45))}
    .name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:2.1rem;line-height:1;letter-spacing:.01em}
    .sub{font-size:.66rem;letter-spacing:.4em;text-transform:uppercase;color:var(--brass-2);margin-top:.5rem}
    .msg{
      font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
      font-size:clamp(1.9rem,5.2vw,3.1rem);line-height:1.18;
      margin:2.6rem auto 2.2rem;max-width:16ch;text-shadow:0 2px 22px rgba(0,0,0,.45);
    }
    .btn{
      display:inline-block;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;
      padding:1.1rem 2.7rem;background:var(--brass);color:#fff;text-decoration:none;
      border:1px solid var(--brass);transition:background .35s ease,color .35s ease,border-color .35s ease;
    }
    .btn:hover{background:transparent;color:var(--brass-2);border-color:var(--brass-2)}
    .url{margin-top:1.4rem;font-size:.74rem;letter-spacing:.16em;color:rgba(246,241,231,.6)}
    .url a{color:inherit;text-decoration:none}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <main class="box">
    <img class="mark" src="assets/serenity-mark.svg" alt="Serenity Yachting Club" />
    <div class="name">Serenity</div>
    <div class="sub">Yachting&nbsp;Club</div>
    <p class="msg">Досить підглядати&nbsp;— іди на робочий сайт</p>
    <a class="btn" href="https://serenityyachting.club">Перейти на сайт →</a>
    <p class="url"><a href="https://serenityyachting.club">serenityyachting.club</a></p>
  </main>
</body>
</html>
